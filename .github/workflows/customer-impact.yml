name: Customer impact

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: customer-impact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-impact:
    name: Customer impact recorded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: component
          fetch-depth: 0
          persist-credentials: false
      # This repository is public, so it cannot use actions from the private
      # engine directly. Check out the pinned engine with a read token; fork PRs
      # receive no secrets and fail closed. Bump ref and comment together.
      # The read token is a one-hour automation app token when the app key and
      # ID are shared with this public repository; otherwise the legacy secret.
      - name: Mint engine read token
        id: engine-token
        if: vars.AUTOMATION_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: KanopyAI
          repositories: kanopy-release-engine
          permission-contents: read
      - name: Warn on legacy engine read credential
        if: steps.engine-token.outputs.token == ''
        run: echo "::warning title=Automation credential fallback::The release engine checkout uses a legacy repository secret because the automation app token was unavailable."
      - name: Check out the pinned release engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KanopyAI/kanopy-release-engine
          ref: 7cfddb0cb29236894e86d88ceabce1ba92045ee1 # v1.0.0
          token: ${{ steps.engine-token.outputs.token || secrets.RELEASE_ENGINE_READ_TOKEN || secrets.REVIEW_FIXER_TOKEN }}
          path: release-engine
          persist-credentials: false
      # Checks the feature diff, then the merged candidate (preflight_pull_requests
      # in .github/release-notes-source.json). The component checkout is data only.
      - name: Validate the assessment and merged candidate
        uses: ./release-engine
        with:
          command: gate
          path: component
