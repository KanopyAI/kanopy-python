name: Customer impact

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: customer-impact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-impact:
    name: Customer impact recorded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: component
          fetch-depth: 0
          persist-credentials: false
      # This repository is public, so it cannot use actions from the private
      # engine directly. Check out the pinned engine with a read token; fork PRs
      # receive no secrets and fail closed. Bump ref and comment together.
      - name: Check out the pinned release engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KanopyAI/kanopy-release-engine
          ref: c423a6dcbce5f15b4d0f6d7e6c4ffed1636a5643 # v1.1.0
          token: ${{ secrets.RELEASE_ENGINE_READ_TOKEN || secrets.REVIEW_FIXER_TOKEN }}
          path: release-engine
          persist-credentials: false
      # Checks the feature diff, then the merged candidate (preflight_pull_requests
      # in .github/release-notes-source.json). The component checkout is data only.
      - name: Validate the assessment and merged candidate
        uses: ./release-engine
        with:
          command: gate
          path: component
