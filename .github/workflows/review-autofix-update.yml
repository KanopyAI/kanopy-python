# Generated by kanopy-autofix.
name: Update autofix engine
on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
concurrency:
  group: autofix-engine-update
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: KanopyAI/kanopy-autofix
          ref: e05ce6fb1ded05b71c15dab18eb036525abdb939
          token: ${{ secrets.AUTOFIX_ENGINE_READ_TOKEN || secrets.REVIEW_FIXER_TOKEN }}
          path: engine
          persist-credentials: false
      - name: Fetch centrally approved release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: KanopyAI/kanopy-autofix
          ref: stable
          token: ${{ secrets.AUTOFIX_ENGINE_READ_TOKEN || secrets.REVIEW_FIXER_TOKEN }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Open an update PR
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_UPDATE_TOKEN || secrets.REVIEW_FIXER_TOKEN }}
        run: python3 engine/scripts/update_consumer.py --root control --candidate candidate
