name: Python SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python scripts/check_version.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_dist.py dist
      - run: python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
      - run: python -c "import importlib.metadata, kanopy; assert kanopy.__version__ == importlib.metadata.version('kanopy-ai')"
