# Generated by kanopy-autofix.
name: Review autofix controller tests
on:
  pull_request:
    paths:
      - '.github/review-autofix.json'
      - '.github/autofix-engine.json'
      - '.github/workflows/review-autofix*.yml'
      - '.github/workflows/promotion-path.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    name: Review autofix controller tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: control
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: KanopyAI/kanopy-autofix
        ref: 3427b710a702c5c1fe340d6dcd529ebab167e39f
        token: ${{ secrets.AUTOFIX_ENGINE_READ_TOKEN || secrets.REVIEW_FIXER_TOKEN }}
        path: engine
        persist-credentials: false
    - name: Check pins, profile and caller contract without executing caller code
      env:
        ENGINE_SHA: 3427b710a702c5c1fe340d6dcd529ebab167e39f
        POLICY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        python3 engine/scripts/validate_consumer.py --root control --engine engine --engine-sha "$ENGINE_SHA" --policy-sha "$POLICY_SHA"
        python3 engine/scripts/check_consumer.py --root control
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
