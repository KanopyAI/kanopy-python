name: Review autofix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify existing automation token can read the private engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: KanopyAI/kanopy-autofix
          ref: main
          token: ${{ secrets.REVIEW_FIXER_TOKEN }}
          persist-credentials: false
      - run: test -f README.md
