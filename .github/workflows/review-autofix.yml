name: Review autofix

# Polling batches findings from independent reviewers without letting a PR supply
# the privileged workflow. The schedule runs the version on the default branch.
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (blank processes all eligible PRs)'
        type: string
        default: ''
      dry_run:
        description: 'Preview eligibility and findings; no model calls or writes'
        type: boolean
        default: true

# Serialize live prepare/fix/publish runs. Read-only previews use their own
# group so they can inspect CI while a model is working on another PR.
concurrency:
  group: ${{ inputs.dry_run && format('review-autofix-preview-{0}', github.run_id) || 'review-autofix' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
      (vars.REVIEW_AUTOFIX_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Find eligible PRs
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$PR_NUMBER" ]; then args+=(--number "$PR_NUMBER"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 .github/scripts/review_autofix.py scan "${args[@]}"

  fix:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # current-head check logs and failed-run diagnostics
      checks: read
      statuses: read
      pull-requests: write # reserve a bounded attempt before spending API credits
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      PR_NUMBER: ${{ matrix.pr }}
      REVIEW_DIRECTORY: ${{ github.workspace }}/review-context-${{ matrix.pr }}
      REVIEW_CONTROL_DIRECTORY: ${{ github.workspace }}/control/.github/scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Collect reviewer findings and failed CI checks
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_PUSH_TOKEN: ${{ secrets.REVIEW_FIXER_TOKEN != '' }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 control/.github/scripts/review_autofix.py prepare \
            --number "$PR_NUMBER" --directory "$REVIEW_DIRECTORY" "${args[@]}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.prepare.outputs.ready == 'true'
        with:
          ref: ${{ steps.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.prepare.outputs.ready == 'true'
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Prepare repository validation
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python3 control/.github/scripts/review_autofix.py setup \
            --directory "$REVIEW_DIRECTORY" --source "$GITHUB_WORKSPACE/source"
      - name: Fetch pinned Codex action
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openai/codex-action
          ref: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
          path: codex-action
          persist-credentials: false
      - name: Install bounded Codex execution adapter
        if: steps.prepare.outputs.ready == 'true'
        run: python3 control/.github/scripts/review_autofix_runner.py patch-action "$GITHUB_WORKSPACE/codex-action"
      - name: Preserve runner DNS before dropping privileges
        if: steps.prepare.outputs.ready == 'true'
        # Upstream drop-sudo can break systemd-resolved's service sockets.
        # Use the runner's existing upstream DNS, preserving all privilege drops.
        # Configure before the action removes sudo; no model or PR code runs here.
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 control/.github/scripts/review_autofix_dns.py configure
          python3 control/.github/scripts/review_autofix_dns.py check
      - name: Investigate and fix findings
        if: steps.prepare.outputs.ready == 'true'
        uses: ./codex-action
        with:
          codex-version: '0.160.0'
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/source
          prompt-file: ${{ env.REVIEW_DIRECTORY }}/prompt.md
          output-file: ${{ env.REVIEW_DIRECTORY }}/agent-report.json
          output-schema-file: ${{ github.workspace }}/control/.github/prompts/review-autofix.schema.json
          model: ${{ vars.REVIEW_AUTOFIX_MODEL }}
          effort: high
          sandbox: workspace-write
          safety-strategy: drop-sudo
      - name: Verify DNS remains available after Codex
        if: always() && steps.prepare.outputs.ready == 'true'
        run: python3 control/.github/scripts/review_autofix_dns.py check
      - name: Independently run tests and package the patch
        if: steps.prepare.outputs.ready == 'true'
        # No GitHub or push token is passed to code/tests from the PR.
        run: |
          python3 control/.github/scripts/review_autofix.py package \
            --directory "$REVIEW_DIRECTORY" --source "$GITHUB_WORKSPACE/source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.prepare.outputs.ready == 'true'
        with:
          name: review-autofix-${{ matrix.pr }}
          path: ${{ env.REVIEW_DIRECTORY }}/artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [discover, fix]
    if: >-
      always() && !cancelled() && needs.discover.result == 'success' &&
      needs.discover.outputs.matrix != '[]' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      PR_NUMBER: ${{ matrix.pr }}
    steps:
      # Fresh runner: never execute PR code with a repository write credential.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true # publisher reports a missing artifact as a failed attempt
        with:
          name: review-autofix-${{ matrix.pr }}
          path: result
      - name: Recheck PR, publish a tested fix, and request review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_FIXER_TOKEN: ${{ secrets.REVIEW_FIXER_TOKEN }}
        run: |
          python3 control/.github/scripts/review_autofix.py publish \
            --number "$PR_NUMBER" --directory "$GITHUB_WORKSPACE/result" \
            --source "$RUNNER_TEMP/publish-$PR_NUMBER"
