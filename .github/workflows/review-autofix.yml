# Generated by kanopy-autofix; edit repository policy, then render again.
name: Review autofix
on:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  status:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (blank scans eligible PRs)
        type: string
        default: ''
      dry_run:
        description: Inspect eligibility without a model call or writes
        type: boolean
        default: true
      retry_run_id:
        description: Explicit failed-run retry within the existing three-attempt cap
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: write
jobs:
  discover:
    if: (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (vars.REVIEW_AUTOFIX_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      kind: ${{ steps.policy.outputs.kind }}
      bot_users: ${{ steps.policy.outputs.bot_users }}
    steps:
    - name: Checkout trusted caller policy
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.workflow_sha }}
        path: control
        persist-credentials: false
    - name: Mint engine read token
      id: engine-token
      if: vars.AUTOMATION_APP_ID != ''
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: KanopyAI
        repositories: kanopy-autofix
        permission-contents: read
    - name: Warn on legacy engine read credential
      if: steps.engine-token.outputs.token == ''
      run: echo '::warning title=Automation credential fallback::Engine checkout uses the legacy repository secret
        because the automation app token was unavailable.'
    - name: Checkout pinned autofix engine
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: KanopyAI/kanopy-autofix
        ref: 7b15bddf782197759d7bca21da949e00d727dc88
        token: ${{ steps.engine-token.outputs.token || secrets.AUTOFIX_ENGINE_READ_TOKEN || secrets.REVIEW_FIXER_TOKEN
          }}
        path: engine
        persist-credentials: false
    - name: Verify engine and policy pins
      env:
        ENGINE_SHA: 7b15bddf782197759d7bca21da949e00d727dc88
        POLICY_SHA: ${{ github.workflow_sha }}
      run: python3 engine/scripts/validate_consumer.py --root control --engine engine --engine-sha "$ENGINE_SHA"
        --policy-sha "$POLICY_SHA"
    - name: Read validation profile
      id: policy
      run: python3 engine/scripts/validate_consumer.py --root control --outputs
    - name: Find eligible PRs
      id: scan
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        args=()
        if [ -n "$PR_NUMBER" ]; then args+=(--number "$PR_NUMBER"); fi
        if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
        python3 engine/.github/scripts/review_autofix.py scan "${args[@]}"
    - name: Mint publisher token
      id: app-token
      if: '!inputs.dry_run && vars.AUTOMATION_APP_ID != '''' && (steps.scan.outputs.matrix != ''[]'' || (steps.scan.outputs.codex_requests
        != ''[]'' && steps.scan.outputs.codex_requests != ''''))'
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: KanopyAI
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write
    - name: Warn on legacy publisher credential
      if: steps.scan.outputs.matrix != '[]' && !inputs.dry_run && steps.app-token.outputs.token == ''
      run: echo '::warning title=Automation credential fallback::The publisher check uses the legacy REVIEW_FIXER_TOKEN
        secret because the automation app token was unavailable.'
    - name: Verify publisher credential before starting model work
      if: steps.scan.outputs.matrix != '[]' && !inputs.dry_run
      env:
        REVIEW_FIXER_TOKEN: ${{ steps.app-token.outputs.token || secrets.REVIEW_FIXER_TOKEN }}
      run: python3 engine/.github/scripts/review_autofix_access.py
    - name: Request initial Codex reviews
      if: steps.scan.outputs.codex_requests != '[]' && steps.scan.outputs.codex_requests != '' && !inputs.dry_run
      env:
        GH_TOKEN: ${{ github.token }}
        CODEX_REQUEST_TOKEN: ${{ secrets.REVIEW_FIXER_TOKEN || steps.app-token.outputs.token }}
        CODEX_REQUESTS: ${{ steps.scan.outputs.codex_requests }}
      run: python3 engine/.github/scripts/review_autofix.py request-codex-reviews --numbers "$CODEX_REQUESTS"
    defaults:
      run:
        shell: bash
  pr:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/review-autofix-pr.yml
    with:
      engine_sha: 7b15bddf782197759d7bca21da949e00d727dc88
      policy_sha: ${{ github.workflow_sha }}
      pr_number: ${{ format('{0}', matrix.pr) }}
      kind: ${{ needs.discover.outputs.kind }}
      bot_users: ${{ needs.discover.outputs.bot_users }}
      dry_run: ${{ inputs.dry_run || false }}
      retry_run_id: ${{ inputs.retry_run_id }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: write
env:
  REVIEW_AUTOFIX_POLICY_ROOT: ${{ github.workspace }}/control
  REVIEW_CONTROL_DIRECTORY: ${{ github.workspace }}/engine/.github/scripts
